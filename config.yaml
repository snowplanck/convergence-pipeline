genome_dir: data/toy_genomes
genome_table: ''
trait_list: ''
outdir: results
genome_ani_threshold: 95.0
protein_identity_threshold: 95.0
evalue_threshold: 1.0e-05
homology_gap_threshold: 0.3
kofam_threshold: score
b1_confidence: 0.9
b2_tmscore: 0.5
b2_fident: 0.3
b3_tmscore: 0.6
nise_mmseqs_evalue: 0.001
nise_hhblits_prob: 95.0
nise_min_tools: 2
cluster_method: apcluster
mantel_permutations: 999
test_mode: true
gpu_enabled: false
dry_run: false
max_threads: 8
max_memory_gb: 32
db_dir: databases
alphafold_db: databases/alphafold
foldseek_db: databases/foldseek/v4
eggnog_db: databases/eggnog
kofam_dir: databases/kofam
uniref_dir: databases/uniref
# Directory containing external tool binaries (prepended to PATH). Empty = rely on PATH.
external_tools_dir: ''
# B1 real-mode method: auto | proteinfer | clean
b1_method: auto
# B3 folding method: esmfold (single-sequence, default) | colabfold (MSA-based, slow)
b3_method: esmfold
# Per-protein timeout (seconds) for the expensive B3 folding stage.
b3_per_protein_timeout: 1800.0
# Device preference for GPU-capable steps: auto | cpu | cuda
force_device: auto
